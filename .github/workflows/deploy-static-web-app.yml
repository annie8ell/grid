name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:
  # Trigger manually or via webhook from VM after update.php runs

env:
  STATIC_WEB_APP_NAME: ${{ secrets.AZURE_STATIC_WEB_APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Site
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Latest Public Files from VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts
          
          # Download public directory from VM
          echo "Downloading public files from VM..."
          rsync -avz --delete $VM_USER@$VM_HOST:/opt/grid/public/ ./public/
          
          # Verify files were downloaded
          ls -la ./public/
          if [ ! -f "./public/index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi
      
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "public"
          skip_app_build: true
          skip_api_build: true
      
      - name: Deployment Summary
        run: |
          echo "✅ Static site deployed successfully"
          echo "🌐 Site URL: https://${{ env.STATIC_WEB_APP_NAME }}.azurestaticapps.net"
